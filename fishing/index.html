<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ตกปลาสบายใจ</title>
  <meta name="description" content="เกมตกปลาสบาย ๆ ริมน้ำตก">
  <meta name="theme-color" content="#7cc4f0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/game.css?v=261021151638">
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" crossorigin="anonymous"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "./js/audio.js": "./js/audio.js?v=261021151638",
      "./js/fish.js": "./js/fish.js?v=261021151638",
      "./js/main.js": "./js/main.js?v=261021151638",
      "./js/toon.js": "./js/toon.js?v=261021151638",
      "./js/world.js": "./js/world.js?v=261021151638"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=261021151638"></script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="pill" id="count" title="ปลาที่ตกได้">🐟 <b>0</b></div>
    <div class="btns">
      <button id="btnDex" class="round" aria-label="สมุดสะสมปลา">📖<i id="dexNew" class="dot hidden"></i></button>
      <button id="btnMute" class="round" aria-label="เปิด/ปิดเสียง">🔊</button>
    </div>
  </div>

  <div id="hint"></div>
  <div id="toast"></div>
  <div id="alert" class="hidden">!</div>

  <div id="power" class="hidden"><div class="track"><div class="fill"></div></div><span>แรงเหวี่ยง</span></div>

  <div id="fight" class="hidden">
    <div class="row"><span>แรงตึงสาย</span><span id="fightName"></span></div>
    <div class="bar"><div class="zone"></div><div class="needle"></div></div>
    <div class="row"><span>🐟 ดึงปลาเข้าฝั่ง</span></div>
    <div class="prog"><div class="pfill"></div></div>
  </div>

  <div id="joy" class="hidden"><div class="knob"></div></div>
  <button id="action" class="hidden"><span class="ico">🎣</span><span class="txt">เหวี่ยง</span></button>

  <div id="catch" class="modal hidden">
    <div class="card catchCard">
      <div class="badge hidden" id="catchBadge">ใหม่!</div>
      <img id="catchImg" alt="">
      <h2 id="catchName"></h2>
      <div class="stars" id="catchStars"></div>
      <div class="stats"><div><small>น้ำหนัก</small><b id="catchKg"></b></div><div><small>ความยาว</small><b id="catchCm"></b></div></div>
      <p id="catchDesc"></p>
      <button class="primary" id="catchOk">เก็บใส่ข้องปลา</button>
    </div>
  </div>

  <div id="dex" class="modal hidden">
    <div class="card dexCard">
      <div class="dexHead"><h2>📖 สมุดสะสมปลา</h2><button class="round" id="dexClose" aria-label="ปิด">✕</button></div>
      <div class="dexSum" id="dexSum"></div>
      <div class="dexGrid" id="dexGrid"></div>
    </div>
  </div>

  <div id="title">
    <div class="titleBox">
      <div class="logo">🎣</div>
      <h1>ตกปลาสบายใจ</h1>
      <p class="sub">ริมน้ำตกสายหมอก</p>
      <div id="loadBar"><div></div></div>
      <button class="primary hidden" id="startBtn">เริ่มตกปลา</button>
      <div class="howto">
        <div><b>เดิน</b> WASD / ลูกศร · จอยซ้ายล่าง</div>
        <div><b>เหวี่ยงเบ็ด</b> กดค้าง Space / คลิกค้าง / ปุ่ม 🎣 แล้วปล่อย (ค้างนาน = ไกล)</div>
        <div><b>ทุ่นจม!</b> กดทันที แล้ว <b>กดค้าง</b> กรอสาย · ปล่อยเมื่อสายตึงจัด</div>
      </div>
    </div>
  </div>
  <noscript>ต้องเปิด JavaScript เพื่อเล่นเกม</noscript>
</body>
</html>
